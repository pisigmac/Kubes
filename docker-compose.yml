version: "3.9"

services:
  kubes-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kubes-web
    restart: unless-stopped
    ports:
      - "${KUBES_WEB_PORT:-3000}:3000"
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PRIMARY_MODEL=${PRIMARY_MODEL:-gemini-3.8-flash}
      - AUTH_MODE=${AUTH_MODE:-none}
      - CUBES_CHROME=/usr/bin/chromium
      - CUBES_COMPUTER_ROOT=/app/data/computer
    volumes:
      - kubes_data:/app/data
    depends_on:
      - kubes-agent-core
    networks:
      - kubes-network

  kubes-agent-core:
    build:
      context: ./services/agent-core
      dockerfile: Dockerfile
    container_name: kubes-agent-core
    restart: unless-stopped
    ports:
      - "${KUBES_AGENT_CORE_PORT:-8000}:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - KUBEMIND_ENABLED=${KUBEMIND_ENABLED:-false}
      - KUBEMIND_GATEWAY_URL=${KUBEMIND_GATEWAY_URL:-http://localhost:9080}
    networks:
      - kubes-network

  kubes-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kubes-scheduler
    restart: unless-stopped
    command: ["node", "--experimental-strip-types", "scripts/scheduler.ts"]
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PRIMARY_MODEL=${PRIMARY_MODEL:-gemini-3.8-flash}
      - CUBES_COMPUTER_ROOT=/app/data/computer
    volumes:
      - kubes_data:/app/data
    depends_on:
      - kubes-web
    networks:
      - kubes-network

volumes:
  kubes_data:
    driver: local

networks:
  kubes-network:
    driver: bridge
